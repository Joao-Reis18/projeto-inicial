<mat-card>
    <mat-card-header class="titulo-card" [style.background-color]="corTitulo()">
        <mat-card-title>{{titulo()}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="icon-container">
            <mat-icon class="icons" *ngIf="icone()" [style.color]="corDescricaoLetra()">{{icone()}}</mat-icon>
        </div>
        <p class="texto-descricao" [style.color]="corDescricaoLetra()">{{descricao()}}</p>
    </mat-card-content>
</mat-card>
