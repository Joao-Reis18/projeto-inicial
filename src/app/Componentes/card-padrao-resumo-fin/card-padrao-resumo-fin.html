<div class="card" [style.background-color]="corCard()" [style.border-color]="bordacard()">

    <div class="titulo-card" [style.background-color]="corTitulo()">
        <b [style.color]="corTituloLetra()">{{ titulo() }}</b>
        <div> 
            <mat-icon class="icons" *ngIf="icone()" [style.color]="corDescricaoLetra()">{{icone()}}</mat-icon>
        </div>
    </div>

    <div class="descricao-card">

        <span [style.color]="corDescricaoLetra()">{{descricao()}}</span>
    </div>
</div>
