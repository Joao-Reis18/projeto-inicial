<div class="card" [style.background-color]="corCard()">

    <div class="titulo-card w-100" [style.background-color]="corTitulo()">
        <b [style.color]="corTituloLetra()">{{ titulo() }}</b>
    </div>

    <div class="descricao-card">
        <mat-icon class="icon-acoes" *ngIf="icone()" [style.color]="corDescricaoLetra()">{{icone()}}</mat-icon>
    </div>
</div>
